<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>入力パネルのイメージ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #edf4f1, #f7f4ed);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .panel {
      width: 390px;
      padding: 18px;
      color: #f9fafb;
      background: #111827;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
      box-shadow: 0 20px 55px rgba(17,24,39,.25);
    }
    h1 { margin: 0 0 10px; font-size: 18px; }
    p { margin: 0 0 10px; color: #d1d5db; font-size: 13px; line-height: 1.6; }
    .tag { display: inline-block; margin-bottom: 12px; padding: 4px 9px; border-radius: 999px; background: #26384a; color: #bfdbfe; font-size: 12px; }
    textarea {
      display: block;
      width: 100%;
      height: 112px;
      padding: 11px;
      resize: none;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 8px;
      background: rgba(255,255,255,.08);
      color: white;
      font: 12px/1.7 ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .actions { display: flex; gap: 9px; margin-top: 12px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; font-weight: 700; font-size: 13px; }
    .primary { flex: 1; background: #22c55e; color: #052e16; }
    .secondary { background: #374151; color: #f9fafb; }
    .status { margin-top: 12px; color: #bfdbfe; font-size: 12px; }
  </style>
</head>
<body>
  <main class="panel" aria-label="入力パネルのイメージ">
    <h1>toto 投票パターン入力</h1>
    <span class="tag">ページ種別：シングル</span>
    <p>1行に1パターン入力します。試合ごとの選択はカンマで区切ってください。</p>
    <textarea readonly>2,1,1,2,1,2,1,1,0,2,2,1,1
1,1,0,2,1,2,0,1,2,2,1,1,0</textarea>
    <div class="actions">
      <button class="primary" type="button">入力する</button>
      <button class="secondary" type="button">クリア</button>
    </div>
    <div class="status">準備完了です。パターンを貼り付けて「入力する」を押してください。</div>
  </main>
</body>
</html>
