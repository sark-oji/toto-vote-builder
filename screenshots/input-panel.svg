<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" role="img" aria-labelledby="title desc">
  <title id="title">toto 投票パターン入力パネルのイメージ</title>
  <desc id="desc">投票パターン入力パネルのイメージです。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf3ef"/>
      <stop offset="1" stop-color="#f7f3e9"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#14221c" flood-opacity=".2"/>
    </filter>
  </defs>
  <rect width="880" height="560" fill="url(#bg)"/>
  <rect x="240" y="58" width="400" height="420" rx="18" fill="#111827" stroke="#ffffff" stroke-opacity=".14" filter="url(#shadow)"/>
  <text x="268" y="100" fill="#f9fafb" font-family="sans-serif" font-size="20" font-weight="700">toto 投票パターン入力</text>
  <rect x="268" y="119" width="136" height="27" rx="13.5" fill="#26384a"/>
  <text x="280" y="137" fill="#bfdbfe" font-family="sans-serif" font-size="12">ページ種別：シングル</text>
  <text x="268" y="176" fill="#d1d5db" font-family="sans-serif" font-size="13">1行に1パターン入力します。</text>
  <text x="268" y="196" fill="#d1d5db" font-family="sans-serif" font-size="13">試合ごとの選択はカンマで区切ってください。</text>
  <rect x="268" y="216" width="344" height="130" rx="9" fill="#1d2736" stroke="#ffffff" stroke-opacity=".16"/>
  <text x="284" y="246" fill="#ffffff" font-family="monospace" font-size="13">2,1,1,2,1,2,1,1,0,2,2,1,1</text>
  <text x="284" y="269" fill="#ffffff" font-family="monospace" font-size="13">1,1,0,2,1,2,0,1,2,2,1,1,0</text>
  <rect x="268" y="362" width="235" height="42" rx="8" fill="#22c55e"/>
  <text x="385.5" y="388" fill="#052e16" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700">入力する</text>
  <rect x="512" y="362" width="100" height="42" rx="8" fill="#374151"/>
  <text x="562" y="388" fill="#f9fafb" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700">クリア</text>
  <text x="268" y="433" fill="#bfdbfe" font-family="sans-serif" font-size="12">準備完了です。パターンを貼り付けて「入力する」を押してください。</text>
</svg>
